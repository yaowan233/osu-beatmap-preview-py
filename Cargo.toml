[package]
name = "osu-beatmap-preview-py"
version = "0.1.9"
edition = "2021"
license = "MIT"
description = "Python bindings for osu-beatmap-preview"
repository = "https://github.com/yaowan233/osu-beatmap-preview-py"

[lib]
name = "_core"
crate-type = ["cdylib"]

[workspace]
members = ["vendor/osu-beatmap-preview-core", "vendor/osu-beatmap-preview-cli"]
default-members = ["."]
resolver = "2"

[dependencies]
# 上游 main（v1.4.0 之后）：固定最新提交，确保各平台 wheel 使用相同的渲染实现。
osu-beatmap-preview-core = { git = "https://github.com/2710165659/osu-beatmap-preview", rev = "0045d40cdf5a0a6b5cfb7da502668b845fcd3024" }
osu-beatmap-preview-cli = { git = "https://github.com/2710165659/osu-beatmap-preview", rev = "0045d40cdf5a0a6b5cfb7da502668b845fcd3024" }
pyo3 = { version = "0.23", features = ["abi3-py310", "extension-module"] }
serde_json = "1"

[patch."https://github.com/2710165659/osu-beatmap-preview"]
# 渲染器及构建资源随源码分发，确保 Python sdist 可以独立构建。
osu-beatmap-preview-core = { path = "vendor/osu-beatmap-preview-core" }
osu-beatmap-preview-cli = { path = "vendor/osu-beatmap-preview-cli" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
