[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "osu-beatmap-preview-py"
version = "0.1.3"
description = "Python bindings for the osu-beatmap-preview renderer"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "osu-beatmap-preview-py contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/yaowan233/osu-beatmap-preview-py"
Repository = "https://github.com/yaowan233/osu-beatmap-preview-py"
Issues = "https://github.com/yaowan233/osu-beatmap-preview-py/issues"

[dependency-groups]
dev = [
    "maturin>=1.8,<2",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.maturin]
bindings = "pyo3"
module-name = "osu_beatmap_preview._core"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
